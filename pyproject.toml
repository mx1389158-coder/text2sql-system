[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula-text2sql"
version = "0.1.0"
description = "安全、可评测、可微调的中文 Text2SQL 系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlglot>=25,<29",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
eval = ["pandas>=2.2,<3"]
observability = ["langfuse>=5,<6"]

[project.scripts]
text2sql-eval = "packages.evaluation.cli:main"

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --disable-warnings"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".conda", ".venv", "apps/web/node_modules", "apps/web/dist"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008"]

